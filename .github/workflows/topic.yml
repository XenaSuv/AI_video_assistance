name: Topic Deep-Dive Video

on:
  schedule:
    - cron: "0 10 * * 2"   # Tuesday  10:00 UTC
    - cron: "0 10 * * 4"   # Thursday 10:00 UTC
  workflow_dispatch:
    inputs:
      format:
        description: "Topic format (leave blank for automatic pick)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - honest_review
          - hidden_gems
          - ai_project_build
          - news_with_opinion
      skip_upload:
        description: "Build video but skip YouTube upload"
        required: false
        default: "false"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu libjpeg-dev zlib1g-dev \
            libfreetype6-dev liblcms2-dev libwebp-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Restore topic idea queue
        uses: actions/cache@v4
        with:
          path: |
            data/topic_ideas.json
            data/topic_ideas_used.json
          key: topic-ideas-${{ github.run_id }}
          restore-keys: topic-ideas-

      - name: Restore YouTube OAuth credentials
        run: |
          mkdir -p config
          echo "${{ secrets.YOUTUBE_TOKEN_PICKLE_B64 }}"   | base64 --ignore-garbage -d > config/token.pickle
          echo "${{ secrets.YOUTUBE_CLIENT_SECRETS_B64 }}" | base64 --ignore-garbage -d > config/client_secrets.json

          RU_TOKEN="${{ secrets.YOUTUBE_TOKEN_PICKLE_RU_B64 }}"
          RU_SECRETS="${{ secrets.YOUTUBE_CLIENT_SECRETS_RU_B64 }}"
          if [ -n "$RU_TOKEN" ] && [ -n "$RU_SECRETS" ]; then
            set +e
            echo "$RU_TOKEN"   | base64 --ignore-garbage -d > config/token_ru.pickle
            echo "$RU_SECRETS" | base64 --ignore-garbage -d > config/client_secrets_ru.json
            set -e
          fi

      - name: Validate credentials
        run: |
          python3 - <<'EOF'
          import pickle, json, sys, pathlib

          def check(label, path, loader):
              p = pathlib.Path(path)
              if not p.exists():
                  print(f"  {label}: not present")
                  return
              try:
                  loader(p)
                  print(f"  {label}: OK ({p.stat().st_size} bytes)")
              except Exception as e:
                  print(f"  {label}: INVALID — {e}", file=sys.stderr)
                  sys.exit(1)

          print("English channel:")
          check("token.pickle",        "config/token.pickle",        lambda p: pickle.load(p.open("rb")))
          check("client_secrets.json", "config/client_secrets.json", lambda p: json.load(p.open()))

          print("Russian channel:")
          check("token_ru.pickle",         "config/token_ru.pickle",         lambda p: pickle.load(p.open("rb")))
          check("client_secrets_ru.json",  "config/client_secrets_ru.json",  lambda p: json.load(p.open()))
          EOF

      - name: Run topic pipeline
        env:
          SLACK_WEBHOOK_URL:      ${{ vars.SLACK_WEBHOOK_URL }}
          OPENAI_API_KEY:         ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL:           ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          ELEVENLABS_API_KEY:     ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID:    ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL:       eleven_turbo_v2_5
          PEXELS_API_KEY:         ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:        ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_SECRETS: config/client_secrets.json
          YOUTUBE_TOKEN_FILE:     config/token.pickle
          YOUTUBE_CATEGORY_ID:    "28"
          YOUTUBE_PRIVACY:        public
          SCRIPT_TARGET_WORDS:    "2200"
          OUTPUT_DIR:             output
          LOG_DIR:                logs
          DATA_DIR:               data
          BACKGROUND_MUSIC_PATH:  ${{ vars.BACKGROUND_MUSIC_PATH || 'background_music.mp3' }}
          BACKGROUND_MUSIC_VOLUME: ${{ vars.BACKGROUND_MUSIC_VOLUME || '0.10' }}
          SHORTS_MUSIC_VOLUME:    ${{ vars.SHORTS_MUSIC_VOLUME || '0.13' }}
          RU_ENABLED:             ${{ vars.RU_ENABLED || 'false' }}
          RU_ELEVENLABS_VOICE_ID: ${{ secrets.RU_ELEVENLABS_VOICE_ID }}
          RU_ELEVENLABS_MODEL:    eleven_multilingual_v2
          RU_YOUTUBE_CLIENT_SECRETS: config/client_secrets_ru.json
          RU_YOUTUBE_TOKEN_FILE:  config/token_ru.pickle
          PRESENTER_ENABLED:      ${{ vars.PRESENTER_ENABLED || 'false' }}
          PRESENTER_AVATAR_PATH:  ${{ vars.PRESENTER_AVATAR_PATH || 'assets/avatar.png' }}
          RUNWAYML_API_KEY:       ${{ secrets.RUNWAYML_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.format }}" ]; then
            ARGS="$ARGS --format ${{ github.event.inputs.format }}"
          fi
          if [ "${{ github.event.inputs.skip_upload }}" = "true" ]; then
            ARGS="$ARGS --skip-upload"
          fi
          python src/topic_main.py $ARGS

      - name: Archive logs and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topic-${{ github.run_id }}
          path: |
            logs/
            output/topic/*/*/run.log
            output/topic/*/*/script.json
            output/topic/*/*/idea.json
            output/topic/*/*/open_loops.json
            output/topic/*/*/comment_magnet.json
            output/topic/*/*/pacing_audit.json
            output/topic/*/*/thumbnail.jpg
          retention-days: 30
