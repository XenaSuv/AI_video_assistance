name: Daily AI News Video

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC every day
  workflow_dispatch:        # manual trigger button

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore dedup database
        uses: actions/cache@v4
        with:
          path: data/seen_stories.db
          key: seen-stories-${{ github.run_id }}
          restore-keys: seen-stories-

      - name: Restore YouTube OAuth credentials
        run: |
          mkdir -p config
          echo "${{ secrets.YOUTUBE_TOKEN_PICKLE_B64 }}"    | base64 -d > config/token.pickle
          echo "${{ secrets.YOUTUBE_CLIENT_SECRETS_B64 }}"  | base64 -d > config/client_secrets.json
          # Russian channel credentials (only written if secrets are set)
          if [ -n "${{ secrets.YOUTUBE_TOKEN_PICKLE_RU_B64 }}" ]; then
            echo "${{ secrets.YOUTUBE_TOKEN_PICKLE_RU_B64 }}"   | base64 -d > config/token_ru.pickle
            echo "${{ secrets.YOUTUBE_CLIENT_SECRETS_RU_B64 }}" | base64 -d > config/client_secrets_ru.json
          fi

      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: eleven_turbo_v2_5
          YOUTUBE_CLIENT_SECRETS: config/client_secrets.json
          YOUTUBE_TOKEN_FILE: config/token.pickle
          YOUTUBE_CATEGORY_ID: "28"
          YOUTUBE_PRIVACY: unlisted
          SCRIPT_TARGET_WORDS: "2200"
          OUTPUT_DIR: output
          LOG_DIR: logs
          DATA_DIR: data
          DEDUP_TTL_DAYS: "30"
          # Russian variant — set RU_ENABLED=true once credentials are configured
          RU_ENABLED: ${{ vars.RU_ENABLED || 'false' }}
          RU_ELEVENLABS_VOICE_ID: ${{ secrets.RU_ELEVENLABS_VOICE_ID }}
          RU_ELEVENLABS_MODEL: eleven_multilingual_v2
          RU_YOUTUBE_CLIENT_SECRETS: config/client_secrets_ru.json
          RU_YOUTUBE_TOKEN_FILE: config/token_ru.pickle
        run: python src/main.py

      - name: Archive logs and script
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-logs-${{ github.run_id }}
          path: |
            logs/
            output/*/run.log
            output/*/script.json
            output/*/news.json
            output/*/thumbnail.jpg
          retention-days: 14
