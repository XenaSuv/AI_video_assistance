name: Weekly AI Tutorials

on:
  schedule:
    - cron: "0 9 * * 1"   # Monday    09:00 UTC — Claude
    - cron: "0 9 * * 3"   # Wednesday 09:00 UTC — ChatGPT
    - cron: "0 9 * * 5"   # Friday    09:00 UTC — Gemini
  workflow_dispatch:
    inputs:
      tool:
        description: "AI tool tutorial to produce"
        required: false
        default: "claude"
        type: choice
        options: [claude, chatgpt, gemini]
      topic:
        description: "Override topic (leave blank for automatic rotation)"
        required: false
        default: ""
      skip_upload:
        description: "Build video but skip YouTube upload"
        required: false
        default: "false"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu libjpeg-dev zlib1g-dev libfreetype6-dev liblcms2-dev libwebp-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Restore weekly topic logs
        uses: actions/cache@v4
        with:
          path: |
            data/weekly_topics_claude.json
            data/weekly_topics_chatgpt.json
            data/weekly_topics_gemini.json
          key: weekly-topics-${{ github.run_id }}
          restore-keys: weekly-topics-

      - name: Restore YouTube OAuth credentials
        run: |
          mkdir -p config
          echo "${{ secrets.YOUTUBE_TOKEN_PICKLE_B64 }}"   | base64 --ignore-garbage -d > config/token.pickle
          echo "${{ secrets.YOUTUBE_CLIENT_SECRETS_B64 }}" | base64 --ignore-garbage -d > config/client_secrets.json

          # Russian credentials — decoded inside set +e so any failure is non-fatal.
          RU_TOKEN="${{ secrets.YOUTUBE_TOKEN_PICKLE_RU_B64 }}"
          RU_SECRETS="${{ secrets.YOUTUBE_CLIENT_SECRETS_RU_B64 }}"
          if [ -n "$RU_TOKEN" ] && [ -n "$RU_SECRETS" ]; then
            set +e
            echo "$RU_TOKEN"   | base64 --ignore-garbage -d > config/token_ru.pickle
            echo "$RU_SECRETS" | base64 --ignore-garbage -d > config/client_secrets_ru.json
            set -e
          fi

      - name: Migrate pickle tokens to JSON
        run: |
          python3 - <<'EOF'
          import io, pickle, json, pathlib

          def migrate(src, dst):
              s, d = pathlib.Path(src), pathlib.Path(dst)
              if not s.exists():
                  return
              raw = s.read_bytes()
              try:
                  creds = pickle.load(io.BytesIO(raw))
                  d.write_text(creds.to_json())
              except Exception:
                  # Secret was already updated to JSON format
                  text = raw.decode()
                  json.loads(text)  # validate — raises if truly corrupt
                  d.write_text(text)
              s.unlink()
              print(f"  Migrated {s.name} → {d.name}")

          migrate("config/token.pickle",    "config/token.json")
          migrate("config/token_ru.pickle", "config/token_ru.json")
          EOF

      - name: Validate credentials
        run: |
          python3 - <<'EOF'
          import json, sys, pathlib
          from google.oauth2.credentials import Credentials

          def check(label, path, loader):
              p = pathlib.Path(path)
              if not p.exists():
                  print(f"  {label}: not present")
                  return
              try:
                  loader(p)
                  print(f"  {label}: OK ({p.stat().st_size} bytes)")
              except Exception as e:
                  print(f"  {label}: INVALID - {e}", file=sys.stderr)
                  sys.exit(1)

          def load_token(p):
              return Credentials.from_authorized_user_info(json.loads(p.read_text()))

          print("English channel:")
          check("token.json",          "config/token.json",          load_token)
          check("client_secrets.json", "config/client_secrets.json", lambda p: json.load(p.open()))

          print("Russian channel:")
          check("token_ru.json",          "config/token_ru.json",          load_token)
          check("client_secrets_ru.json", "config/client_secrets_ru.json", lambda p: json.load(p.open()))
          EOF

      - name: Determine tool from schedule or input
        id: tool
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case $(date +%u) in   # 1=Mon 3=Wed 5=Fri
              1) TOOL=claude   ;;
              3) TOOL=chatgpt  ;;
              5) TOOL=gemini   ;;
              *) TOOL=claude   ;;
            esac
          else
            TOOL="${{ github.event.inputs.tool }}"
            TOOL="${TOOL:-claude}"
          fi
          echo "tool=$TOOL" >> $GITHUB_OUTPUT
          echo "Running tutorial pipeline for tool: $TOOL"

      - name: Run weekly pipeline
        env:
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
          OPENAI_API_KEY:         ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL:           ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          TELEGRAM_RSS_URLS:      ${{ vars.TELEGRAM_RSS_URLS }}
          ELEVENLABS_API_KEY:     ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID:    ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL:       eleven_turbo_v2_5
          YOUTUBE_CLIENT_SECRETS: config/client_secrets.json
          YOUTUBE_TOKEN_FILE:     config/token.json
          YOUTUBE_CATEGORY_ID:    "27"   # Education
          YOUTUBE_PRIVACY:        public
          SCRIPT_TARGET_WORDS:    "2200"
          OUTPUT_DIR:             output
          LOG_DIR:                logs
          DATA_DIR:               data
          PEXELS_API_KEY:         ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:        ${{ secrets.PIXABAY_API_KEY }}
          BACKGROUND_MUSIC_PATH:  ${{ vars.BACKGROUND_MUSIC_PATH || 'background_music.mp3' }}
          BACKGROUND_MUSIC_VOLUME: ${{ vars.BACKGROUND_MUSIC_VOLUME || '0.10' }}
          SHORTS_MUSIC_VOLUME:    ${{ vars.SHORTS_MUSIC_VOLUME || '0.13' }}
          # Russian variant
          RU_ENABLED:             ${{ vars.RU_ENABLED || 'false' }}
          RU_ELEVENLABS_VOICE_ID: ${{ secrets.RU_ELEVENLABS_VOICE_ID }}
          RU_ELEVENLABS_MODEL:    eleven_multilingual_v2
          RU_YOUTUBE_CLIENT_SECRETS: config/client_secrets_ru.json
          RU_YOUTUBE_TOKEN_FILE:  config/token_ru.json
          PRESENTER_ENABLED:      ${{ vars.PRESENTER_ENABLED || 'false' }}
          PRESENTER_AVATAR_PATH:  ${{ vars.PRESENTER_AVATAR_PATH || 'assets/avatar.png' }}
          HEYGEN_ENABLED:         ${{ vars.HEYGEN_ENABLED || 'false' }}
          HEYGEN_API_KEY:         ${{ secrets.HEYGEN_API_KEY }}
          HEYGEN_AVATAR_ID:       ${{ secrets.HEYGEN_AVATAR_ID }}
          HEYGEN_AVATAR_ID_DIRECT:       ${{ secrets.HEYGEN_AVATAR_ID_DIRECT }}
          HEYGEN_AVATAR_ID_SERIOUS:      ${{ secrets.HEYGEN_AVATAR_ID_SERIOUS }}
          HEYGEN_AVATAR_ID_CURIOUS:      ${{ secrets.HEYGEN_AVATAR_ID_CURIOUS }}
          HEYGEN_AVATAR_ID_PROFESSIONAL: ${{ secrets.HEYGEN_AVATAR_ID_PROFESSIONAL }}
          HEYGEN_AVATAR_ID_CASUAL:       ${{ secrets.HEYGEN_AVATAR_ID_CASUAL }}
          HEYGEN_VOICE_ID:        ${{ secrets.HEYGEN_VOICE_ID }}
          RUNWAYML_API_KEY:       ${{ secrets.RUNWAYML_API_KEY }}
        run: |
          TOOL="${{ steps.tool.outputs.tool }}"
          ARGS="--tool $TOOL"
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            ARGS="$ARGS --topic \"${{ github.event.inputs.topic }}\""
          fi
          if [ "${{ github.event.inputs.skip_upload }}" = "true" ]; then
            ARGS="$ARGS --skip-upload"
          fi
          eval python src/weekly_main.py $ARGS

      - name: Archive logs and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-${{ steps.tool.outputs.tool }}-${{ github.run_id }}
          path: |
            logs/
            output/weekly/${{ steps.tool.outputs.tool }}/*/run.log
            output/weekly/${{ steps.tool.outputs.tool }}/*/script.json
            output/weekly/${{ steps.tool.outputs.tool }}/*/script_ru.json
            output/weekly/${{ steps.tool.outputs.tool }}/*/topic.txt
            output/weekly/${{ steps.tool.outputs.tool }}/*/thumbnail.jpg
            output/weekly/${{ steps.tool.outputs.tool }}/*/thumbnail_ru.jpg
          retention-days: 30
