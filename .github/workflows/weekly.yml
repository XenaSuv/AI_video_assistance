name: Weekly Claude Tutorial

on:
  schedule:
    - cron: "0 9 * * 0"   # 09:00 UTC every Sunday
  workflow_dispatch:
    inputs:
      topic:
        description: "Override topic (leave blank to use automatic rotation)"
        required: false
        default: ""
      skip_upload:
        description: "Build video but skip YouTube upload"
        required: false
        default: "false"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore weekly topics log
        uses: actions/cache@v4
        with:
          path: data/weekly_topics.json
          key: weekly-topics-${{ github.run_id }}
          restore-keys: weekly-topics-

      - name: Restore YouTube OAuth credentials
        run: |
          mkdir -p config
          echo "${{ secrets.YOUTUBE_TOKEN_PICKLE_B64 }}"   | base64 --ignore-garbage -d > config/token.pickle
          echo "${{ secrets.YOUTUBE_CLIENT_SECRETS_B64 }}" | base64 --ignore-garbage -d > config/client_secrets.json

      - name: Validate credentials
        run: |
          python3 - <<'EOF'
          import pickle, json, sys, pathlib

          def check(label, path, loader):
              p = pathlib.Path(path)
              if not p.exists():
                  print(f"  {label}: not present", file=sys.stderr)
                  sys.exit(1)
              try:
                  loader(p)
                  print(f"  {label}: OK ({p.stat().st_size} bytes)")
              except Exception as e:
                  print(f"  {label}: INVALID — {e}", file=sys.stderr)
                  sys.exit(1)

          check("token.pickle",        "config/token.pickle",        lambda p: pickle.load(p.open("rb")))
          check("client_secrets.json", "config/client_secrets.json", lambda p: json.load(p.open()))
          EOF

      - name: Run weekly pipeline
        env:
          OPENAI_API_KEY:        ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL:          gpt-4o-mini
          ELEVENLABS_API_KEY:    ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID:   ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL:      eleven_turbo_v2_5
          YOUTUBE_CLIENT_SECRETS: config/client_secrets.json
          YOUTUBE_TOKEN_FILE:    config/token.pickle
          YOUTUBE_CATEGORY_ID:   "27"   # Education category
          YOUTUBE_PRIVACY:       unlisted
          SCRIPT_TARGET_WORDS:   "2200"
          OUTPUT_DIR:            output
          LOG_DIR:               logs
          DATA_DIR:              data
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            ARGS="--topic ${{ github.event.inputs.topic }}"
          fi
          if [ "${{ github.event.inputs.skip_upload }}" = "true" ]; then
            ARGS="$ARGS --skip-upload"
          fi
          python src/weekly_main.py $ARGS

      - name: Archive logs and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-run-${{ github.run_id }}
          path: |
            logs/
            output/weekly/*/run.log
            output/weekly/*/script.json
            output/weekly/*/topic.txt
            output/weekly/*/thumbnail.jpg
          retention-days: 30
