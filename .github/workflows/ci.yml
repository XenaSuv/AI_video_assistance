name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: |
          # sgmllib3k (feedparser → arxiv transitive dep) has no wheel and
          # fails to build from source on Python 3.12. Create a stub dist-info
          # so pip considers the dependency satisfied without building anything.
          SITE=$(python -c "import site; print(site.getsitepackages()[0])")
          mkdir -p "$SITE/sgmllib3k-1.0.0.dist-info"
          printf "Metadata-Version: 2.1\nName: sgmllib3k\nVersion: 1.0.0\n" \
            > "$SITE/sgmllib3k-1.0.0.dist-info/METADATA"
          touch "$SITE/sgmllib3k-1.0.0.dist-info/RECORD"
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check src/

      - name: Type check (mypy)
        env:
          OPENAI_API_KEY: test-key-openai
          ELEVENLABS_API_KEY: test-key-elevenlabs
        run: python -m mypy src/

      - name: Run tests with coverage
        env:
          # Dummy values — conftest.py also sets these, but explicit is safer
          OPENAI_API_KEY: test-key-openai
          ELEVENLABS_API_KEY: test-key-elevenlabs
        run: python -m pytest tests/ -v --tb=short --cov=src --cov-report=term-missing --cov-report=json --cov-fail-under=75

      - name: Coverage gate (new modules ≥80%)
        run: python scripts/check_new_module_coverage.py
