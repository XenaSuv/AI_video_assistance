name: Breaking AI News

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes, 24/7
  workflow_dispatch:
    inputs:
      skip_upload:
        description: "Build video but skip YouTube upload"
        required: false
        default: "false"

jobs:
  # ── Job 1: fast detector (runs every 30 min, costs nothing if no news) ──────
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_breaking: ${{ steps.check.outputs.has_breaking }}
      breaking_title: ${{ steps.check.outputs.breaking_title }}
      breaking_source: ${{ steps.check.outputs.breaking_source }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu libjpeg-dev zlib1g-dev libfreetype6-dev liblcms2-dev libwebp-dev

      - run: pip install -r requirements.txt

      - name: Restore breaking-news seen state
        uses: actions/cache@v4
        with:
          path: data/breaking_seen.json
          key: breaking-seen-${{ github.run_id }}
          restore-keys: breaking-seen-

      - name: Check for breaking news
        id: check
        env:
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          DATA_DIR:           data
          OUTPUT_DIR:         output
          LOG_DIR:            logs
        run: python src/breaking_detector.py --check

      - name: Upload breaking item (for publish job)
        if: steps.check.outputs.has_breaking == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: breaking-item-${{ github.run_id }}
          path: data/breaking_current.json
          retention-days: 1

  # ── Job 2: full pipeline (only runs when Job 1 found something) ─────────────
  publish:
    needs: detect
    if: needs.detect.outputs.has_breaking == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Download breaking item JSON
        uses: actions/download-artifact@v4
        with:
          name: breaking-item-${{ github.run_id }}
          path: data/

      - name: Restore breaking-news seen state
        uses: actions/cache@v4
        with:
          path: data/breaking_seen.json
          key: breaking-seen-${{ github.run_id }}
          restore-keys: breaking-seen-

      - name: Restore YouTube OAuth credentials
        env:
          YOUTUBE_TOKEN_JSON_B64:        ${{ secrets.YOUTUBE_TOKEN_JSON_B64 }}
          YOUTUBE_CLIENT_SECRETS_B64:    ${{ secrets.YOUTUBE_CLIENT_SECRETS_B64 }}
          YOUTUBE_TOKEN_JSON_RU_B64:     ${{ secrets.YOUTUBE_TOKEN_JSON_RU_B64 }}
          YOUTUBE_CLIENT_SECRETS_RU_B64: ${{ secrets.YOUTUBE_CLIENT_SECRETS_RU_B64 }}
        run: |
          python3 - <<'PYEOF'
          import base64, os, pathlib, sys

          def decode_secret(env_name, out_path, required=True):
              val = os.environ.get(env_name, "").strip()
              if not val:
                  if required:
                      print(f"::error::{env_name} is empty or not set. "
                            "Run 'python src/youtube_uploader.py --auth' locally "
                            "and update the GitHub secret.", file=sys.stderr)
                      sys.exit(1)
                  return False
              try:
                  decoded = base64.b64decode(val)
              except Exception as exc:
                  print(f"::error::{env_name}: base64 decode failed — {exc}. "
                        "Re-encode with: python3 -c \"import base64; "
                        "print(base64.b64encode(open('config/token.json','rb').read()).decode())\"",
                        file=sys.stderr)
                  sys.exit(1)
              if not decoded:
                  print(f"::error::{env_name} decoded to 0 bytes — secret value may be corrupted.",
                        file=sys.stderr)
                  sys.exit(1)
              p = pathlib.Path(out_path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(decoded)
              print(f"  {out_path}: written ({len(decoded)} bytes)")
              return True

          decode_secret("YOUTUBE_TOKEN_JSON_B64",        "config/token.json")
          decode_secret("YOUTUBE_CLIENT_SECRETS_B64",    "config/client_secrets.json")
          decode_secret("YOUTUBE_TOKEN_JSON_RU_B64",     "config/token_ru.json",        required=False)
          decode_secret("YOUTUBE_CLIENT_SECRETS_RU_B64", "config/client_secrets_ru.json", required=False)
          PYEOF

      - name: Validate credentials
        run: |
          python3 - <<'EOF'
          import json, sys, pathlib
          from google.oauth2.credentials import Credentials

          def check(label, path, loader):
              p = pathlib.Path(path)
              if not p.exists():
                  print(f"  {label}: not present")
                  return
              try:
                  loader(p)
                  print(f"  {label}: OK ({p.stat().st_size} bytes)")
              except Exception as e:
                  print(f"  {label}: INVALID - {e}", file=sys.stderr)
                  sys.exit(1)

          def load_token(p):
              return Credentials.from_authorized_user_info(json.loads(p.read_text()))

          print("English channel:")
          check("token.json",          "config/token.json",          load_token)
          check("client_secrets.json", "config/client_secrets.json", lambda p: json.load(p.open()))

          print("Russian channel:")
          check("token_ru.json",          "config/token_ru.json",          load_token)
          check("client_secrets_ru.json", "config/client_secrets_ru.json", lambda p: json.load(p.open()))
          EOF

      - name: Run breaking news pipeline
        env:
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
          OPENAI_API_KEY:            ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL:              ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          TELEGRAM_RSS_URLS:         ${{ vars.TELEGRAM_RSS_URLS }}
          ELEVENLABS_API_KEY:        ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID:       ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL:          eleven_turbo_v2_5
          PEXELS_API_KEY:            ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:           ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_SECRETS:    config/client_secrets.json
          YOUTUBE_TOKEN_FILE:        config/token.json
          YOUTUBE_CATEGORY_ID:       "28"
          YOUTUBE_PRIVACY:           public
          SCRIPT_TARGET_WORDS:       "600"
          OUTPUT_DIR:                output
          LOG_DIR:                   logs
          DATA_DIR:                  data
          BACKGROUND_MUSIC_PATH:     ${{ vars.BACKGROUND_MUSIC_PATH || 'background_music.mp3' }}
          BACKGROUND_MUSIC_VOLUME:   ${{ vars.BACKGROUND_MUSIC_VOLUME || '0.10' }}
          SHORTS_MUSIC_VOLUME:       ${{ vars.SHORTS_MUSIC_VOLUME || '0.13' }}
          RU_ENABLED:                ${{ vars.RU_ENABLED || 'false' }}
          RU_ELEVENLABS_VOICE_ID:    ${{ secrets.RU_ELEVENLABS_VOICE_ID }}
          RU_ELEVENLABS_MODEL:       eleven_multilingual_v2
          RU_YOUTUBE_CLIENT_SECRETS: config/client_secrets_ru.json
          RU_YOUTUBE_TOKEN_FILE:     config/token_ru.json
          PRESENTER_ENABLED:         ${{ vars.PRESENTER_ENABLED || 'false' }}
          PRESENTER_AVATAR_PATH:     ${{ vars.PRESENTER_AVATAR_PATH || 'assets/avatar.png' }}
          HEYGEN_ENABLED:            ${{ vars.HEYGEN_ENABLED || 'false' }}
          HEYGEN_API_KEY:            ${{ secrets.HEYGEN_API_KEY }}
          HEYGEN_AVATAR_ID:          ${{ secrets.HEYGEN_AVATAR_ID }}
          HEYGEN_AVATAR_ID_DIRECT:          ${{ secrets.HEYGEN_AVATAR_ID_DIRECT }}
          HEYGEN_AVATAR_ID_SERIOUS:         ${{ secrets.HEYGEN_AVATAR_ID_SERIOUS }}
          HEYGEN_AVATAR_ID_CURIOUS:         ${{ secrets.HEYGEN_AVATAR_ID_CURIOUS }}
          HEYGEN_AVATAR_ID_PROFESSIONAL:    ${{ secrets.HEYGEN_AVATAR_ID_PROFESSIONAL }}
          HEYGEN_AVATAR_ID_CASUAL:          ${{ secrets.HEYGEN_AVATAR_ID_CASUAL }}
          HEYGEN_VOICE_ID:           ${{ secrets.HEYGEN_VOICE_ID }}
          RUNWAYML_API_KEY:          ${{ secrets.RUNWAYML_API_KEY }}
        run: |
          ARGS="--item data/breaking_current.json"
          if [ "${{ github.event.inputs.skip_upload }}" = "true" ]; then
            ARGS="$ARGS --skip-upload"
          fi
          python src/breaking_main.py $ARGS

      - name: Archive logs and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breaking-${{ github.run_id }}
          path: |
            logs/
            output/breaking/*/run.log
            output/breaking/*/short_script.json
            output/breaking/*/short_script_ru.json
            output/breaking/*/shorts.mp4
            output/breaking/*/shorts_ru.mp4
          retention-days: 14
