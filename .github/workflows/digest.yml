name: Sunday Weekly Digest

on:
  schedule:
    - cron: "0 10 * * 0"   # Sunday 10:00 UTC (2h after the daily run)
  workflow_dispatch:
    inputs:
      date:
        description: "Sunday date to digest (YYYY-MM-DD, leave blank for today)"
        required: false
        default: ""
      skip_upload:
        description: "Build video but skip YouTube upload"
        required: false
        default: "false"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore digest scripts cache (Mon-Sat daily scripts)
        uses: actions/cache@v4
        with:
          path: data/digest_scripts/
          key: digest-scripts-${{ github.run_id }}
          restore-keys: digest-scripts-

      - name: Restore YouTube OAuth credentials
        run: |
          mkdir -p config
          echo "${{ secrets.YOUTUBE_TOKEN_PICKLE_B64 }}"   | base64 --ignore-garbage -d > config/token.pickle
          echo "${{ secrets.YOUTUBE_CLIENT_SECRETS_B64 }}" | base64 --ignore-garbage -d > config/client_secrets.json

          RU_TOKEN="${{ secrets.YOUTUBE_TOKEN_PICKLE_RU_B64 }}"
          RU_SECRETS="${{ secrets.YOUTUBE_CLIENT_SECRETS_RU_B64 }}"
          if [ -n "$RU_TOKEN" ] && [ -n "$RU_SECRETS" ]; then
            set +e
            echo "$RU_TOKEN"   | base64 --ignore-garbage -d > config/token_ru.pickle
            echo "$RU_SECRETS" | base64 --ignore-garbage -d > config/client_secrets_ru.json
            set -e
          fi

      - name: Validate credentials
        run: |
          python3 - <<'EOF'
          import pickle, json, sys, pathlib

          def check(label, path, loader):
              p = pathlib.Path(path)
              if not p.exists():
                  print(f"  {label}: not present")
                  return
              try:
                  loader(p)
                  print(f"  {label}: OK ({p.stat().st_size} bytes)")
              except Exception as e:
                  print(f"  {label}: INVALID - {e}", file=sys.stderr)
                  sys.exit(1)

          print("English channel:")
          check("token.pickle",       "config/token.pickle",       lambda p: pickle.load(p.open("rb")))
          check("client_secrets.json","config/client_secrets.json",lambda p: json.load(p.open()))

          print("Russian channel:")
          check("token_ru.pickle",        "config/token_ru.pickle",        lambda p: pickle.load(p.open("rb")))
          check("client_secrets_ru.json", "config/client_secrets_ru.json", lambda p: json.load(p.open()))
          EOF

      - name: Run digest pipeline
        env:
          OPENAI_API_KEY:         ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL:           gpt-4o-mini
          ELEVENLABS_API_KEY:     ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID:    ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL:       eleven_turbo_v2_5
          YOUTUBE_CLIENT_SECRETS: config/client_secrets.json
          YOUTUBE_TOKEN_FILE:     config/token.pickle
          YOUTUBE_CATEGORY_ID:    "28"   # Science & Technology
          YOUTUBE_PRIVACY:        unlisted
          SCRIPT_TARGET_WORDS:    "950"
          OUTPUT_DIR:             output
          LOG_DIR:                logs
          DATA_DIR:               data
          # Russian variant
          RU_ENABLED:             ${{ vars.RU_ENABLED || 'false' }}
          RU_ELEVENLABS_VOICE_ID: ${{ secrets.RU_ELEVENLABS_VOICE_ID }}
          RU_ELEVENLABS_MODEL:    eleven_multilingual_v2
          RU_YOUTUBE_CLIENT_SECRETS: config/client_secrets_ru.json
          RU_YOUTUBE_TOKEN_FILE:  config/token_ru.pickle
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          if [ "${{ github.event.inputs.skip_upload }}" = "true" ]; then
            ARGS="$ARGS --skip-upload"
          fi
          python src/digest_main.py $ARGS

      - name: Archive logs and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: |
            logs/
            output/digest/*/run.log
            output/digest/*/script.json
            output/digest/*/script_ru.json
            output/digest/*/thumbnail.jpg
            output/digest/*/thumbnail_ru.jpg
          retention-days: 30
