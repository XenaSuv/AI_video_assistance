[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E9: syntax errors; F: pyflakes; B: bugbear; I: isort
# F401/F841 ignored — unused imports/vars common in large heterogeneous pipelines
select = ["E9", "F", "B", "I"]
ignore = ["F401", "F841"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = true
warn_unused_ignores = false
# Exclude heavy modules that have known stub issues or are optional integrations
exclude = [
    "src/presenter\\.py",
    "src/dashboard\\.py",
    "src/debug_dashboard\\.py",
]

# Legacy modules with deep structural type mismatches — excluded from strict checks.
# New modules added to this repo must NOT be added here; fix their types instead.
[[tool.mypy.overrides]]
module = [
    # ── pre-existing ignores (structural/stub issues) ──────────────────────────
    "src.editorial_brain",
    "src.hook_optimizer",
    "src.hook_mutation_engine",
    "src.youtube_uploader",
    # BeautifulSoup returns AttributeValueList union types that are hard to narrow
    "src.scraper",
    # OpenAI SDK types content as str | None; 6 identical patterns across rewrites
    "src.humanizer_agent",
    # DALL-E response Images type is complex to narrow
    "src.image_generator",
    # PIL stubs flag LANCZOS constant path and FreeTypeFont|ImageFont union types
    "src.thumbnail_mvp",
    "src.thumbnail_generator",
    "src.thumbnail_ab",
    "src.infographic_generator",
    "src.end_card",
    "src.quote_card",
    # ── legacy modules: untyped pre-strict codebase ────────────────────────────
    "src.ab_testing_engine",
    "src.auto_action_engine",
    "src.breaking_detector",
    "src.breaking_main",
    "src.breaking_script_generator",
    "src.broll_fetcher",
    "src.checkpoint",
